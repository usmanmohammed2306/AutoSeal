[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoseal-lab"
version = "0.1.0"
description = "Evidence-driven evaluator integrity research platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "hypothesis>=6,<7"]
server = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[project.scripts]
autoseal = "autoseal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
