name: CI

on:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AutoSeal
        run: python -m pip install -e '.[dev,server]'
      - name: Run tests
        run: python -m pytest -q -m 'not docker'
      - name: Check process evidence
        run: python -m autoseal conformance process-evidence
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: apps/studio/pnpm-lock.yaml
      - name: Install Studio
        run: pnpm --dir apps/studio install --frozen-lockfile
      - name: Typecheck Studio
        run: pnpm --dir apps/studio typecheck
      - name: Build Studio
        run: pnpm --dir apps/studio build
