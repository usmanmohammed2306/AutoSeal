services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: autoseal
      POSTGRES_DB: autoseal
      POSTGRES_PASSWORD: ${AUTOSEAL_DB_PASSWORD:?Set AUTOSEAL_DB_PASSWORD locally}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - autoseal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoseal -d autoseal"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  autoseal_pgdata:
