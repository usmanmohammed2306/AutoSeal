# Local TLS only. Uses an isolated private CA, never a public ACME request.
services:
  proxy:
    image: autoseal-proxy:archive-local
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - archive_tls_data:/data
      - archive_tls_config:/config
    ports:
      - "127.0.0.1:${AUTOSEAL_TLS_PORT:?Set the local TLS test port}:8443"
    depends_on:
      studio:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
volumes:
  archive_tls_data:
  archive_tls_config:
