# Local validation profile. No public listener, cloud provisioning or worker.
services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: autoseal
      POSTGRES_DB: autoseal
      POSTGRES_PASSWORD: ${AUTOSEAL_DB_PASSWORD:?Set a disposable database password}
    volumes:
      - archive_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U autoseal -d autoseal"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
  migrate:
    image: autoseal-api:archive-local
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      AUTOSEAL_DATABASE_URL: postgresql+psycopg://autoseal:${AUTOSEAL_DB_PASSWORD:?Set a disposable database password}@db:5432/autoseal
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=32m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
  api:
    image: autoseal-api:archive-local
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      AUTOSEAL_DATABASE_URL: postgresql+psycopg://autoseal:${AUTOSEAL_DB_PASSWORD:?Set a disposable database password}@db:5432/autoseal
      AUTOSEAL_OPERATOR_TOKEN: ${AUTOSEAL_OPERATOR_TOKEN:?Set a separate operator token}
      AUTOSEAL_READER_TOKEN: ${AUTOSEAL_READER_TOKEN:?Set a separate reader token}
    volumes:
      - archive_data:/var/lib/autoseal
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/runs?limit=1',headers={'Authorization':'Bearer '+os.environ['AUTOSEAL_READER_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 5s
      timeout: 4s
      start_period: 10s
      retries: 12
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 64
  studio:
    image: autoseal-studio:archive-local
    build:
      context: ../apps/studio
      dockerfile: ../../deploy/studio.Dockerfile
    environment:
      AUTOSEAL_API_URL: http://api:8000
      AUTOSEAL_API_TOKEN: ${AUTOSEAL_READER_TOKEN:?Set a separate reader token}
      AUTOSEAL_STUDIO_USER: ${AUTOSEAL_STUDIO_USER:?Set a local viewer name}
      AUTOSEAL_STUDIO_PASSWORD: ${AUTOSEAL_STUDIO_PASSWORD:?Set a local viewer password of at least 16 characters}
      AUTOSEAL_STUDIO_READ_ONLY: "true"
    ports:
      - "127.0.0.1:${AUTOSEAL_STUDIO_PORT:-3203}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/',{method:'HEAD'}).then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 6
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
volumes:
  archive_pg:
  archive_data:
